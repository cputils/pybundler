[package]
name = "pybundler"
version = "0.1.0"
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
keywords = ["python", "bundler", "cli"]
license = "MIT"
repository = "https://github.com/cputils/pybundler"
description = "Bundle a Python program and its local dependencies into a single script"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Ruff 0.15.22 requires compact_str 0.9, which get-size2 0.10.1+ no longer supports.
get-size2 = "=0.10.0"
ruff_formatter = { git = "https://github.com/astral-sh/ruff", tag = "0.15.22" }
ruff_linter = { git = "https://github.com/astral-sh/ruff", tag = "0.15.22" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.22" }
ruff_python_formatter = { git = "https://github.com/astral-sh/ruff", tag = "0.15.22" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.22" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.15.22" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.22" }
zip = "8.6.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
